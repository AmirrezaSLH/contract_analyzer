# Local build-and-run. Keys come from .env (gitignored, optional here); state
# lives in bind mounts so the database and the JSON log survive `down` and stay
# readable from the host.
name: contract-analyzer

# A YAML merge key replaces a whole mapping, so the shared environment lives in
# its own anchor: a service that adds one variable merges this in rather than
# silently dropping the rest.
x-env: &env
  # Absolute, so they do not depend on the working directory, and pointed at
  # the mounts rather than at the image's own filesystem.
  DB_PATH: /app/data/contracts.db
  RAW_DIR: /app/data/raw
  ASSETS_DIR: /app/data/assets
  LOG_FILE: /app/.run/app.jsonl
  BACKEND_PORT: ${BACKEND_PORT:-8100}
  FRONTEND_PORT: ${FRONTEND_PORT:-8101}

x-app: &app
  build:
    context: .
    target: runtime
    args:
      # `make docker-build` passes the host's; otherwise the bind mounts end
      # up owned by uid 1000. Not named UID: that one is readonly in bash.
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
  image: contract-analyzer:${TAG:-dev}
  env_file:
    - path: .env
      required: false
  environment: *env
  volumes:
    - ./data:/app/data
    - ./.run:/app/.run
  # Both servers set `restart: unless-stopped` on themselves below. It is not
  # in the anchor because `tools` is a one-off container and restarting a
  # finished pytest run is not a policy anyone wants.

services:
  # The HTTP API: the only process that touches the database and the model.
  # Everything else -- the UI, the MCP server, a connector -- is a client of it.
  api:
    <<: *app
    command: ["api"]
    # Safe to restart: jobs in flight are marked failed on shutdown rather than
    # left for a client to poll forever. Analyses live in memory, so a restart
    # loses them -- GET /analyses/{id} says so in its 404 hint.
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8100}:${BACKEND_PORT:-8100}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.environ.get('BACKEND_PORT', '8100') + '/health').read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # The Streamlit front end: four surfaces over the API, and a client of it
  # like any other. It holds no logic, opens no database and calls no model --
  # `CA_API_URL` is the whole of its configuration.
  ui:
    <<: *app
    command: ["ui"]
    # Safe to restart: it holds nothing that a reload loses except a browser
    # session's own view state, which the ids in the API outlive.
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8101}:${FRONTEND_PORT:-8101}"
    environment:
      <<: *env
      # Over the compose network, so there is no cross-origin request and
      # `api_cors_origins` stays empty -- the Streamlit *server* makes these
      # calls, not the browser.
      CA_API_URL: http://api:${BACKEND_PORT:-8100}
    depends_on:
      api:
        # Not just "started": the UI calls GET /health on its first render, and
        # a UI that boots into "the API is not reachable" is a worse first
        # impression than one that waits three seconds.
        condition: service_healthy

  # One-off container for the things that are not servers: pytest, ruff, the
  # ingest/search/chat CLIs, a shell. Built from the dev stage, never started
  # by `up`.
  #   docker compose run --rm tools test
  #   docker compose run --rm tools python scripts/ingest.py data/raw/contract.pdf
  tools:
    <<: *app
    build:
      context: .
      target: dev
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: contract-analyzer:${TAG:-dev}-dev
    profiles: ["tools"]
    command: ["shell"]
    stdin_open: true
    tty: true
    volumes:
      - ./data:/app/data
      - ./.run:/app/.run
      # Source from the host: the install is editable, so an edit is live in
      # the container without a rebuild.
      - ./src:/app/src
      - ./tests:/app/tests
      - ./scripts:/app/scripts
