# Local build-and-run. Keys come from .env (gitignored, optional here); state
# lives in bind mounts so the database and the JSON log survive `down` and stay
# readable from the host. Tuning is settings.json, versioned with the code,
# mounted so a restart without a rebuild picks up an edit.
name: contract-analyzer

# A YAML merge key replaces a whole mapping, so the shared environment lives in
# its own anchor: a service that adds one variable merges this in rather than
# silently dropping the rest.
x-env: &env
  # Absolute, so they do not depend on the working directory, and pointed at
  # the mounts rather than at the image's own filesystem.
  DB_PATH: /app/data/contracts.db
  RAW_DIR: /app/data/raw
  ASSETS_DIR: /app/data/assets
  LOG_FILE: /app/.run/app.jsonl
  BACKEND_PORT: ${BACKEND_PORT:-8100}
  MCP_PORT: ${MCP_PORT:-8102}

x-app: &app
  build:
    context: .
    target: runtime
    args:
      # `make docker-build` passes the host's; otherwise the bind mounts end
      # up owned by uid 1000. Not named UID: that one is readonly in bash.
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
  image: contract-analyzer:${TAG:-dev}
  init: true
  env_file:
    - path: .env
      required: false
  environment: *env
  volumes:
    - ./data:/app/data
    - ./.run:/app/.run
    - ./settings.json:/app/settings.json:ro
  # `api` sets `restart: unless-stopped` on itself rather than in the
  # anchor, because `tools` is a one-off container and restarting a finished
  # pytest run is not a policy anyone wants.

services:
  # The HTTP API, and the built front end it serves at `/`. One origin: the
  # browser never makes a cross-origin request, so `api_cors_origins` stays
  # empty. Everything else -- the MCP server, a connector -- is a client of it.
  api:
    <<: *app
    command: ["api"]
    # One uvicorn process: `api_workers` is a thread pool inside it, not
    # `uvicorn --workers`. In-flight jobs are reconciled to `interrupted` on
    # the next boot; the `analyses` row and its report survive in the mounted
    # database. Live SSE and cancel do not: those are per-process.
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8100}:${BACKEND_PORT:-8100}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.environ.get('BACKEND_PORT', '8100') + '/health').read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # The MCP connector, the fourth surface. It reaches the API over HTTP like
  # every other client -- `CA_API_URL`, not `DB_PATH`. volumes lists only
  # settings.json, never data/: this container has no database to open even
  # if someone tried. API_KEY still arrives via env_file, same as the API.
  #
  # HTTP rather than stdio, because a container's stdin is not where a desktop
  # client is. A local Claude Desktop runs `python -m mcp_connector` against a
  # checkout instead; see MCP-Connector/README.md.
  mcp:
    <<: *app
    command: ["mcp"]
    restart: unless-stopped
    environment:
      # A merge key replaces the whole mapping, so the shared block is merged
      # in rather than dropped -- the same reason `x-env` exists at all.
      <<: *env
      CA_API_URL: http://api:${BACKEND_PORT:-8100}
      MCP_TRANSPORT: http
      # Not 127.0.0.1: inside a container that is the container, and the
      # published port would answer nothing.
      MCP_HOST: 0.0.0.0
    volumes:
      - ./settings.json:/app/settings.json:ro
    ports:
      - "${MCP_PORT:-8102}:${MCP_PORT:-8102}"
    depends_on:
      api:
        # The connector's first call is the host's `get_started`, and an
        # `api_unreachable` in the first ten seconds of a demo is avoidable.
        condition: service_healthy

  # One-off container for the things that are not servers: pytest, ruff, the
  # ingest/search/chat/analyze CLIs, a shell. Built from the dev stage, never
  # started by `up`.
  #   docker compose run --rm tools test
  #   docker compose run --rm tools python scripts/ingest.py data/raw/contract.pdf
  tools:
    <<: *app
    build:
      context: .
      target: dev
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: contract-analyzer:${TAG:-dev}-dev
    profiles: ["tools"]
    command: ["shell"]
    stdin_open: true
    tty: true
    volumes:
      - ./data:/app/data
      - ./.run:/app/.run
      - ./settings.json:/app/settings.json:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      # Source from the host: the install is editable, so an edit is live in
      # the container without a rebuild. MCP-Connector/ is a second package
      # root; omitting it left connector tests running against the image copy.
      - ./src:/app/src
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./MCP-Connector:/app/MCP-Connector
