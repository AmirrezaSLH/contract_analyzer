[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-analyzer"
version = "0.1.0"
description = "Compliance analysis of PDF contracts: parsing, hybrid retrieval, cited answers, agentic evaluation."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.40",
    # The one HTTP stack. Both SDKs are built on httpx2, so a single client with
    # a single retry policy can be handed to each of them.
    "httpx2>=2.0",
    # AGPL-3.0. See docs/parsing.md on why this repo may depend on it for a local demo.
    "pymupdf>=1.24",
    "sqlite-vec>=0.1.6",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # Real token counts for the chunk budget; tokens.py falls back to a
    # characters/4 estimate if it is missing or its BPE table cannot be fetched.
    "tiktoken>=0.7",
]

[project.optional-dependencies]
# The torch download is ~800 MB, so the offline embedder is opt-in:
#   pip install -e ".[local]"
local = ["sentence-transformers>=3.0"]
# The HTTP surface. Separate from the core so the CLIs, the tests and the
# ingest path install without a web framework:
#   pip install -e ".[api]"
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    # Multipart form parsing, which FastAPI needs for file uploads.
    "python-multipart>=0.0.9",
]
# The Streamlit front end. Separate from `[api]` so the CLIs, the tests and the
# ingest path install without a web framework either way:
#   pip install -e ".[ui]"
# `httpx2` is already core, so the UI needs no HTTP dependency of its own.
# Pinned at >=1.45 for `st.segmented_control`, `st.fragment(run_every=...)`,
# `[theme.fontFaces]` and `theme.baseRadius`; verified against 1.62.0.
ui = ["streamlit>=1.45"]
# `httpx` here is not a second HTTP stack: the application calls out through
# `httpx2` only. This is what `fastapi.testclient.TestClient` is built on, and
# it never leaves the test process.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "contract-analyzer[api]",
    "contract-analyzer[ui]",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contract_analyzer = ["*.sql", "generation/*.json", "compliance/*.json", "agents/*.json"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
