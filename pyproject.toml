[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-analyzer"
version = "0.1.0"
description = "Compliance analysis of PDF contracts: parsing, hybrid retrieval, cited answers, agentic evaluation."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.40",
    # The one HTTP stack. Both SDKs are built on httpx2, so a single client with
    # a single retry policy can be handed to each of them.
    "httpx2>=2.0",
    # AGPL-3.0. See docs/parsing.md on why this repo may depend on it for a local demo.
    "pymupdf>=1.24",
    # Downscales an extracted figure before it is sent to the API. Imported
    # lazily by the parser, and undeclared until now: it was satisfied by
    # accident through Streamlit, which ee055e2 removed. Without it the resize
    # is skipped silently, which is the wrong kind of quiet.
    "pillow>=10.0",
    "sqlite-vec>=0.1.6",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # Real token counts for the chunk budget; tokens.py falls back to a
    # characters/4 estimate if it is missing or its BPE table cannot be fetched.
    "tiktoken>=0.7",
]

[project.optional-dependencies]
# The torch download is ~800 MB, so the offline embedder is opt-in:
#   pip install -e ".[local]"
local = ["sentence-transformers>=3.0"]
# The HTTP surface. Separate from the core so the CLIs, the tests and the
# ingest path install without a web framework:
#   pip install -e ".[api]"
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    # Multipart form parsing, which FastAPI needs for file uploads.
    "python-multipart>=0.0.9",
]
# The MCP surface, in MCP-Connector/. Separate from `api` because the two are
# different processes with different reasons to exist: the API can serve every
# client without this installed, and this can run against an API on another
# host without the API's dependencies present.
#   pip install -e ".[mcp]"
mcp = [
    "fastmcp>=3.0",
    # The connector's only HTTP stack. Not `httpx2`: it talks to our own API on
    # localhost or a compose network, not to a model provider, so it wants
    # neither the retry transport nor a dependency on the analyzer's client.
    "httpx>=0.27",
]
# `httpx` here is not a second HTTP stack for the analyzer: it calls out through
# `httpx2` only. This is what `fastapi.testclient.TestClient` is built on, and it
# never leaves the test process. (The connector's own use of it is above, and is
# a different process.) The front end is `ui/` (Vite/React), not a Python extra.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "contract-analyzer[api]",
    "contract-analyzer[mcp]",
    "httpx>=0.27",
]

# Two roots. `contract_analyzer` is the product; `mcp_connector` is the MCP
# surface, which lives in MCP-Connector/ and is a client of the API rather than
# a part of it -- see MCP-Connector/README.md.
[tool.setuptools.packages.find]
where = ["src", "MCP-Connector"]

[tool.setuptools.package-data]
contract_analyzer = ["*.sql", "generation/*.json", "compliance/*.json", "agents/*.json"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "MCP-Connector"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# The connector's tests live beside the connector, not in tests/: everything
# about that surface is in one directory. `make test` still runs all of it.
[tool.pytest.ini_options]
testpaths = ["tests", "MCP-Connector/tests"]
pythonpath = ["src", "MCP-Connector"]
